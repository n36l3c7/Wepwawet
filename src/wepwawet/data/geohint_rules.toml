# Operator naming rules for router hostnames (Hoiho-style).
#
# Each rule applies to hostnames ending in `domain`. `pattern` is a Python regular expression
# applied to the lowercase hostname; its `code` group is the place code. `kind` says how to read it:
#   iata  - an airport code, looked up in OurAirports
#   city  - a city name, looked up in GeoNames
#   map   - a code of this operator, translated by `codes` into "City, CC" (looked up in GeoNames)
# Rules are tried before the generic heuristics and get a higher confidence.
# To add an operator, copy a rule; `wepwawet locate` uses the file of the installed version.

[[rule]]
operator = "Hurricane Electric"
domain = "he.net"
pattern = '\.(?P<code>[a-z]{3})\d+\.he\.net$'
kind = "iata"

[[rule]]
operator = "Cogent"
domain = "cogentco.com"
pattern = '\.(?P<code>[a-z]{3})\d+\.atlas\.cogentco\.com$'
kind = "iata"

[[rule]]
operator = "Google"
domain = "1e100.net"
pattern = '^(?P<code>[a-z]{3})\d+s\d+-in-'
kind = "iata"

[[rule]]
operator = "Lumen (Level 3)"
domain = "level3.net"
pattern = '\.(?P<code>[a-z]+?)\d*\.level3\.net$'
kind = "city"

[[rule]]
operator = "Arelion (Twelve99)"
domain = "twelve99.net"
pattern = '^(?P<code>[a-z]{3,4})-'
kind = "map"
