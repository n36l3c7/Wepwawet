name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only token by default; only the release job writes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to a commit (the tag is in the comment; Dependabot moves
# both): a tag can be re-pointed, a commit cannot.

jobs:
  python:
    name: Python (lint, types, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  python-debian:
    # Kali is Debian-based: run the suite on a Debian userland too.
    name: Python tests (Debian container)
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates git >/dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest

  frontend:
    name: Frontend (lint, format, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  packages:
    name: Packages (${{ matrix.arch }})
    # Heavy (about 10 minutes each): release tags and manual runs only.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [python, frontend]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build the frontend and the wheel
        run: |
          (cd frontend && npm ci && npm run build)
          uv build --wheel
      - name: Build .deb, .rpm, Arch and AppImage
        run: bash packaging/linux/build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-${{ matrix.arch }}
          path: dist/packages/
          if-no-files-found: error
          retention-days: 14

  install-test:
    name: Install ${{ matrix.name }} (${{ matrix.arch }})
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          # amd64: every supported distribution.
          - {
              arch: amd64,
              runner: ubuntu-24.04,
              name: Debian 13,
              image: "debian:trixie",
              kind: deb,
              file: "*_amd64.deb",
            }
          - {
              arch: amd64,
              runner: ubuntu-24.04,
              name: Ubuntu 22.04,
              image: "ubuntu:22.04",
              kind: deb,
              file: "*_amd64.deb",
            }
          - {
              arch: amd64,
              runner: ubuntu-24.04,
              name: Ubuntu 24.04,
              image: "ubuntu:24.04",
              kind: deb,
              file: "*_amd64.deb",
            }
          - {
              arch: amd64,
              runner: ubuntu-24.04,
              name: Kali,
              image: "kalilinux/kali-rolling",
              kind: deb,
              file: "*_amd64.deb",
            }
          - { arch: amd64, runner: ubuntu-24.04, name: Fedora 43, image: "fedora:43", kind: rpm, file: "*.x86_64.rpm" }
          - {
              arch: amd64,
              runner: ubuntu-24.04,
              name: Arch,
              image: "archlinux:latest",
              kind: archlinux,
              file: "*-x86_64.pkg.tar.zst",
            }
          - {
              arch: amd64,
              runner: ubuntu-24.04,
              name: AppImage,
              image: "ubuntu:24.04",
              kind: appimage,
              file: "*-x86_64.AppImage",
            }
          # arm64: PySide6 needs glibc 2.39 (Ubuntu 24.04+, Debian 13+); Arch has no official arm64 image.
          - {
              arch: arm64,
              runner: ubuntu-24.04-arm,
              name: Debian 13,
              image: "debian:trixie",
              kind: deb,
              file: "*_arm64.deb",
            }
          - {
              arch: arm64,
              runner: ubuntu-24.04-arm,
              name: Ubuntu 24.04,
              image: "ubuntu:24.04",
              kind: deb,
              file: "*_arm64.deb",
            }
          - {
              arch: arm64,
              runner: ubuntu-24.04-arm,
              name: Kali,
              image: "kalilinux/kali-rolling",
              kind: deb,
              file: "*_arm64.deb",
            }
          - {
              arch: arm64,
              runner: ubuntu-24.04-arm,
              name: Fedora 43,
              image: "fedora:43",
              kind: rpm,
              file: "*.aarch64.rpm",
            }
          - {
              arch: arm64,
              runner: ubuntu-24.04-arm,
              name: AppImage,
              image: "ubuntu:24.04",
              kind: appimage,
              file: "*-aarch64.AppImage",
            }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-${{ matrix.arch }}
          path: packages
      - name: Install and open the window under Xvfb
        run: |
          file="$(cd packages && ls ${{ matrix.file }})"
          docker run --rm -v "$PWD/packages:/pkg:ro" -v "$PWD/packaging/linux:/t:ro" \
            "${{ matrix.image }}" bash /t/test-install.sh "${{ matrix.kind }}" "/pkg/$file"

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: install-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: release
          merge-multiple: true
      - name: Checksums
        run: cd release && sha256sum * > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "Wepwawet ${GITHUB_REF_NAME#v}" --notes-file notes.md
